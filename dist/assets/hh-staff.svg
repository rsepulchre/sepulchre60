  <title id="title">Hodgkin–Huxley action potential on a musical staff</title>
  <desc id="desc">
    A single numerically simulated Hodgkin–Huxley action potential at 6.3 degrees Celsius, drawn in
    dark blue across five light gray staff lines. The horizontal span is 100 milliseconds, with a
    single spike centered near 50 milliseconds. Illustrative model simulation, not experimental
    data.
  </desc>
